name: Collecte TER et statistiques
on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: write
concurrency:
  group: collecte-ter
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les horaires et retards
        env:
          TZ: Europe/Paris
        run: python suivi.py
      - name: Archiver les résultats
        run: |
          git config user.name 'ter-bot'
          git config user.email 'ter-bot@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m 'Mise à jour TER' && git push)
